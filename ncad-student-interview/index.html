      <meta name="description"  content="Fabian Strunden is passionate about augmenting human potential through technology. He currently leads AI strategy at Miro's visual collaboration platform, which empowers teams to collaborate and create together.

Before Miro, Fabian led Software Product at Mira Labs in Los Angeles, where his team built a groundbreaking low-cost AR headset for the industrial workforce.
Fun fact: Universal Studios used Mira's lenses in their Mario Kart rides.

Earlier, as Head of UX at DAQRI in Dublin, he launched WORKSENSE™, an all-in-one AR productivity suite that transformed how the industrial workforce works, learns, and communicates.

With an honours degree in product design, Fabian combines human-centred design and aesthetic sensitivity in all his ventures.
" />
